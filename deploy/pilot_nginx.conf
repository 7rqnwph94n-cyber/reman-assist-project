# Pilot proxy config (nginx)
# - Tight login rate limit
# - Moderate global rate limit
# - Upload caps
# - Longer timeouts for PDF export

limit_req_zone $binary_remote_addr zone=pilot_global:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pilot_login:10m rate=3r/m;

server {
  listen 443 ssl;
  client_max_body_size 200m;

  location /auth/login {
    limit_req zone=pilot_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:5001;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
  }

  location / {
    limit_req zone=pilot_global burst=20 nodelay;
    proxy_pass http://127.0.0.1:5001;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
  }
}
