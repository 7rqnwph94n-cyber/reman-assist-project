name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migration check (heads only)
        run: |
          python scripts/migration_check.py --db ./app.db
      - name: Migrate (sqlite)
        run: |
          python -m flask --app app:create_app db upgrade
      - name: Pytest
        env:
          FLASK_CONFIG: testing
        run: |
          pytest -q
