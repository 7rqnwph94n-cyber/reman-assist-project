name: ci

'on':
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_CONFIG: testing
      FLASK_ENV: development
      APP_ENV: test
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: disposable-ci-test-key-only
      ENABLE_QUICKBOOKS: '0'
      REDIS_URL: ''
      RUN_STRESS_TESTS: '0'
      PILOT_REQUIRE_PDF: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
      - name: Validate migration graph (no database)
        run: |
          python scripts/migration_check.py --heads-only
      - name: Migrate and verify a fresh guarded disposable database
        run: |
          python scripts/ci_migrations.py
      - name: Complete default pytest suite (guarded disposable databases)
        run: |
          python -m pytest -ra
